# No-CoT-SFT baseline: GPT-2 fine-tuned to emit the answer directly (no reasoning).
# Lower bound on the value of intermediate supervision (proposal §5.4).
run_name: gpt2_nocot_sft
seed: 0
offline: false

output_dir: outputs/sft_nocot
data_config: configs/data.yaml

task:
  type: sft
  method: nocot_sft       # supervise the answer only; answer cue is in the (masked) prompt
  backbone: gpt2
  backbone_revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  trace_style: eq_only
  max_length: 256
  mask_prompt: true

train:
  epochs: 1.0             # total_steps is derived from the resolved dataset size
  batch_size: 16
  lr: 0.0001
  weight_decay: 0.0
  warmup_steps: 200
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 500
  keep_last: 3
  max_seconds: 32400

eval:
  max_new_tokens: 16      # answer only, no CoT
  batch_size: 64
  limit: null
