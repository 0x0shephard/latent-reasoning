# Accuracy/reproduction gate for the author-released CODI GPT-2 checkpoint.
# This run never updates model weights and writes to an isolated output directory.
run_name: official_codi_gpt2_validation
seed: 11
output_dir: outputs/official_codi_gpt2
data_config: configs/data_official_codi.yaml

official_source:
  repo: https://github.com/zhenyi4/codi
  revision: 2c2314662c63e9f482ebc46614ffe9af17a241e5

checkpoint:
  repo_id: zen-E/CODI-gpt2
  revision: fd641b3d3edc59e4f534b55588e906588c9e36bb
  filename: pytorch_model.bin
  # Hugging Face LFS object id for the released 406,398,137-byte checkpoint.
  sha256: fd223b14932b8b66605c2a688e7d7193058ff2b40b2c6f6c1547c227d06d8417

model:
  base_model: gpt2
  base_revision: 607a30d783dfa663caf39e06633721c8d4cfcd7e
  model_max_length: 512
  dtype: auto
  lora_rank: 128
  lora_alpha: 32
  lora_dropout: 0.1
  projection_dim: 768
  projection_dropout: 0.0
  projection_layer_norm: true

eval:
  latent_iterations: 6
  max_new_tokens: 256
  batch_size: 128
  limit: null
  datasets: [gsm8k, svamp, multiarith, gsm_hard]
  expected_counts:
    gsm8k: 1319
    svamp: 1000
    multiarith: 180
    gsm_hard: 1319

accuracy_gate:
  reference: CODI paper GPT-2 results
  primary_dataset: gsm8k
  absolute_tolerance: 0.03
  # Only GSM8K is used as a formal reproduction gate. The released source and paper
  # disagree on the MultiArith evaluation count (180 versus 500), so OOD results are
  # persisted for later protocol reconciliation rather than compared as a formal gate.
  published_accuracy:
    gsm8k: 0.437

# Inference-only KV diagnostic. R-KV is used to align teacher trace tokens after the
# official GSM8K reproduction gate passes; it is not presented as CODI's train objective.
kv_subspace:
  data_config: configs/data.yaml
  latent_positions: 6
  importance_weight: 0.1

# Preregistered matched selector-specificity follow-up. These selectors are applied
# during analysis only; the released CODI checkpoint is never updated.
kv_selector_specificity:
  examples: 5000
  data_seed: 1
  random_selector_seeds: [101, 211, 307, 401]
  rank: 4
  selector_signal_margin: 0.01
  required_win_fraction: 0.60

# Confirmatory follow-up after the original R-KV selector-specificity gate. The
# previous 5,000 sample indices are excluded before the seed-2 permutation.
kv_boundary_selector:
  examples: 5000
  data_seed: 2
  forced_boundaries: [first_valid, last_valid]
  interior_selector: rkv
  interior_slots: 4
  random_selector_seeds: [101, 211, 307, 401]
  rank: 4
  selector_signal_margin: 0.01
  required_win_fraction: 0.60
  required_structured_controls: [rkv, uniform]

# Inference-only causal follow-up. The rank-four bases are fitted from the completed
# official-CODI n5000_seed1 cross moments. No model weights are updated. Position 4
# and position 5 are the primary family; the remaining positions and all-position
# intervention are secondary diagnostics.
kv_causal_intervention:
  calibration_statistics: outputs/official_codi_kv_subspaces/n5000_seed1/statistics.pt
  rank: 4
  ridge_ratio: 0.0001
  random_seed: 20260727
  positions: [0, 1, 2, 3, 4, 5]
  primary_positions: [4, 5]
  include_all: true
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05

# Short-horizon optimization screen for deciding which KV target families are worth
# decomposing or distilling. The runner uses stateless equal-L2-norm updates and evaluates
# on a disjoint normalized-question split. Begin with kind-level key versus value targets;
# only refine helpful families by position and layer band.
kv_target_utility:
  examples_per_split: 128
  batch_size: 4
  discovery_seed: 3
  hierarchy: [kind, position, layer_band]
  kinds: [key, value]
  positions: [0, 1, 2, 3, 4, 5]
  layer_bands:
    early: [0, 1, 2, 3]
    middle: [4, 5, 6, 7]
    late: [8, 9, 10, 11]
  metric: l1
  kv_weight: 1.0
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0

# Follow-up after neither pooled KV kind passed the marginal-utility gate. A frozen
# coordinate mask is fitted on a fresh calibration split from repeated positive
# answer-gradient x KV-gradient contributions. The primary key test uses one fixed
# five-percent mask and disjoint update/validation splits; value results are secondary.
kv_gradient_signal:
  examples_per_split: 128
  batch_size: 4
  seed: 5
  primary_kind: key
  kinds: [key, value]
  sparsity: 0.05
  minimum_positive_fraction: 0.60
  random_mask_seed: 20260729
  metric: l1
  kv_weight: 1.0
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0

# Historical TSV-C-inspired diagnostic. This completed contract paired the teacher
# answer-cue colon with the student's pre-cue sixth latent state, excluded the embedding
# state, and used L1. It is retained for artifact reproducibility and is not CODI's
# source-native endpoint objective. Use ``endpoint_tsvc_corrected`` for the correction.
endpoint_tsvc:
  data_config: configs/data.yaml
  calibration_examples: 5000
  update_examples: 256
  validation_examples: 256
  calibration_batch_size: 16
  utility_batch_size: 4
  sampling_seed: 11
  random_basis_seed: 20260803
  rank: 77
  scopes: [endpoint_all_layers, endpoint_layer11]
  primary_scope: endpoint_all_layers
  metric: l1
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05
  primary_controls:
    [answer_only, random_rank77, bottom_rank77, shuffled_top77]

# Corrected source-faithful endpoint experiment. Unlike the historical
# ``endpoint_tsvc`` diagnostic, both teacher and student states are gathered at the
# colon in their respective answer cues. The released CODI implementation consumes
# the complete Hugging Face hidden-state tuple: embedding state plus 12 block outputs.
endpoint_tsvc_corrected:
  data_config: configs/data.yaml
  calibration_examples: 5000
  update_examples: 256
  validation_examples: 256
  calibration_batch_size: 16
  utility_batch_size: 4
  parity_examples: 4
  sampling_seed: 11
  random_basis_seed: 20260803
  rank: 77
  scopes: [endpoint_all_states, endpoint_layer11]
  primary_scope: endpoint_all_states
  metric: smooth_l1
  teacher_std_unbiased: true
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05
  primary_controls:
    [answer_only, random_rank77, bottom_rank77, shuffled_top77]

# Fresh answer-conditioned follow-up to the completed corrected rank-77 experiment.
# Residual PCs are fitted and scored on separate partitions, every normalized question
# from the seed-11 corrected experiment is excluded, and the embedding state is not an
# eligible target.  Rank is selected independently per block by split-stable positive
# alignment with the gold-answer NLL gradient, not by residual energy alone.
endpoint_answer_conditioned:
  data_config: configs/data.yaml
  residual_fit_examples: 1024
  direction_selection_examples: 1024
  update_examples: 256
  validation_examples: 256
  fit_batch_size: 16
  selection_batch_size: 4
  utility_batch_size: 4
  parity_examples: 4
  sampling_seed: 29
  random_basis_seed: 20260804
  minimum_split_z: 1.645
  selection_fdr: 0.05
  maximum_rank_per_state: 64
  exclude_embedding: true
  selection_scope: endpoint_blocks_answer_conditioned
  metric: smooth_l1
  teacher_std_unbiased: true
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05
  primary_controls:
    [answer_only, energy_rank_matched, random_rank_matched,
     shuffled_answer_rank_matched, shuffled_teacher]

# Fresh follow-up after the negative seed-29 activation-local screen. Candidate
# residual PCs are restricted to the final two block states and ranked by induced
# LoRA-parameter-gradient cosine with the gold-answer gradient. PC-gradient norms use
# a deterministic Hutchinson sketch. All seed-11 and seed-29 questions are excluded.
endpoint_parameter_aware:
  data_config: configs/data.yaml
  residual_fit_examples: 1024
  direction_selection_examples: 1024
  update_examples: 256
  validation_examples: 256
  fit_batch_size: 16
  selection_batch_size: 8
  utility_batch_size: 4
  parity_examples: 4
  sampling_seed: 41
  random_basis_seed: 20260805
  probe_seed: 314159
  candidate_states: [11, 12]
  candidate_pc_count: 64
  hutchinson_probes: 8
  minimum_split_z: 1.645
  selection_fdr: 0.05
  maximum_rank_per_state: 8
  selection_scope: endpoint_final_two_blocks_parameter_aware
  metric: smooth_l1
  teacher_std_unbiased: true
  relative_update_norm: 0.0001
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05
  primary_controls:
    [answer_only, energy_rank_matched, random_rank_matched,
     shuffled_answer_rank_matched, shuffled_teacher]

# Rank-matched retention follow-up across the three completed endpoint selectors.
# Each method receives exactly three directions at states 11 and 12. The selected-only
# and discarded-complement targets are trained as separate arms; the student forward
# representation itself remains width 768. Consequently, this experiment measures
# target sufficiency but does not alter inference FLOPs or model architecture.
endpoint_retention:
  data_config: configs/data.yaml
  training_examples: 512
  data_seed: 53
  training_seeds: [53, 59, 61]
  epochs: 1
  batch_size: 4
  learning_rate: 0.00001
  weight_decay: 0.0
  save_every: 32
  common_states: [11, 12]
  common_rank_per_state: 3
  precision: float32
  eval_dataset: gsm8k
  eval_batch_size: 16
  eval_precision: auto
  noninferiority_margin: 0.01
  bootstrap_samples: 10000
  bootstrap_seed: 0
  arms:
    [answer_only, full_common,
     energy_selected, answer_conditioned_selected, parameter_aware_selected,
     energy_complement, answer_conditioned_complement, parameter_aware_complement]

# Frozen-checkpoint causal follow-up. Candidate directions are removed only from the
# exact Hugging Face hidden-state entries 11/12 on the fixed answer-cue colon used by
# the residual collectors. Native decoding does not generate this cue. No
# weight is updated. Rank-matched random arms form the empirical accuracy-loss null.
endpoint_inference_ablation:
  activation_calibration_examples: 1024
  activation_calibration_seed: 67
  activation_calibration_batch_size: 16
  common_states: [11, 12]
  common_rank_per_state: 3
  random_replicates: 20
  random_seed: 20260806
  alpha: 1.0
  minimum_endpoint_coverage: 0.95
  eval_dataset: gsm8k
  eval_batch_size: 32
  precision: auto
  bootstrap_samples: 10000
  bootstrap_seed: 0
  familywise_alpha: 0.05

# Answer-margin geometry and effective dimensionality. This experiment exists because
# the completed state-12 confirmation could only ever detect a very large effect: ln_f
# output never enters the KV cache, so its edit changes one token's logits and nothing
# propagates, and binary exact match on 1,319 questions discards most of the available
# signal. Here the outcome is continuous, the primary subspace is the closed-form
# maximiser of the measured objective rather than a gradient heuristic, retention arms
# ask sufficiency instead of necessity, and three ablation semantics are separated.
# Calibration is GSM8K train and is proven disjoint from GSM8K test.
endpoint_margin_geometry:
  calibration_examples: 2048
  calibration_sampling_seed: 89
  calibration_batch_size: 16
  parity_examples: 64
  # The analytic evaluator is refused unless its first token matches the released
  # greedy decoder on at least this fraction of the parity subset.
  minimum_parity_agreement: 0.99
  analytic_state: 12
  propagating_state: 11
  rank_grid: [1, 2, 3, 4, 8, 16, 32, 64, 128, 256, 512]
  # Rank three is the rank the completed confirmation tested, so the primary gate is
  # a like-for-like rerun with a continuous outcome and a matched selector.
  primary_rank: 3
  semantics_ranks: [3, 16]
  random_replicates: 200
  random_seed: 20260808
  resample_seed: 20260808
  retention_threshold: 0.90
  maximum_calibration_relative_energy_error: 0.005
  maximum_selected_overlap: 0.20
  eval_dataset: gsm8k
  # Pinned, never "auto". On T4-class GPUs recent PyTorch reports bf16 as supported
  # through emulation, so "auto" silently selects bfloat16 (8 mantissa bits, worse
  # than fp16's 10) and the forced-cue baseline drops from 43.29% to 40.41%. The
  # analytic tier is collected in float32, so the generation arms must match it.
  precision: float32
  # The forced-cue baseline must land within this many points of the reproduction
  # gate, otherwise the arms are not comparable to any completed experiment.
  maximum_baseline_accuracy_drift: 0.015
  bootstrap_samples: 10000
  bootstrap_seed: 0
  alpha: 0.05
  # Principal-component bands of the student colon state. The analytic tier found
  # PCs 0-3 carry 82.3% of the variance but only 6.7% of first-token accuracy,
  # while PCs 4-31 carry 11.3% of the variance and 85.9% of accuracy. These bands
  # are appended after every existing registry target, so the completed sweep's
  # arm names and bases are unchanged.
  confirmation_bands: [[0, 4], [4, 16], [4, 32], [0, 32], [32, 768]]
  band_random_replicates: 4

# Exact-match confirmation of the accuracy-bearing principal-component band. The
# discovery above is first-token accuracy from the analytic tier; this re-tests it
# with real greedy decoding and numeric exact match, at pinned float32.
endpoint_band_confirmation:
  primary_band: [4, 32]
  control_band: [0, 4]
  majority_band: [4, 16]
  # Preregistered before any exact-match outcome is read. Discovery values on
  # first-token accuracy were 0.859 (primary retention), 0.067 (control retention)
  # and 32.2 points (primary removal); the thresholds allow for exact match being
  # harder than the first token alone.
  minimum_primary_retention: 0.70
  maximum_control_retention: 0.20
  minimum_primary_removal_points: 0.20
  eval_batch_size: 32
  precision: float32
  bootstrap_samples: 10000
  bootstrap_seed: 0
  alpha: 0.05

# Correctness geometry at the answer cue: does the part of the state that
# *predicts* being right have anything to do with the part that *produces* the
# right answer? Reuses the margin-geometry colon-state cache, so the whole sweep
# is model-free. The calibration pool is split fit/select, and no hyperparameter
# ever touches GSM8K test -- which is also the standing caveat on the band
# experiment, whose boundaries were read off test-set curves.
endpoint_correctness_tracks:
  fit_examples: 1024
  split_seed: 20260812
  random_seed: 20260812
  # Directions the exact-match run confirmed carry the accuracy, and the leading
  # near-uniform-lift directions the correctness signal was found in.
  accuracy_band: [4, 32]
  fisher_shrinkage_grid: [0.01, 0.05, 0.2, 0.5, 0.9]
  null_replicates: 200

  # --- track 1: detect ---
  ridge_grid: [0.0001, 0.001, 0.01, 0.1, 1.0]
  probe_steps: 700
  # The margin-only probe is the thing to beat, not chance. Exploratory work put
  # the raw correctness direction at AUC 0.700 and the model's own margin at
  # 0.874, so an arm that ignores the margin cannot pass however well it scores.
  detect_primary_probe: fisher_plus_margin
  minimum_detect_delta_auc: 0.01

  # --- track 2: steer ---
  alpha_grid: [0.0, 0.25, 0.5, 1.0, 2.0, 4.0, 8.0]
  steer_random_replicates: 8
  # A historical global-steering run reported +0.38 points at best, but did not
  # preserve vector-scale metadata, so its alpha values are not comparable here.
  # This arm confines one explicitly unit-normalized average margin-widening
  # direction to the band the readout is sensitive to. It tests a constant global
  # correction, not a question-conditioned steering map.
  steer_primary_arm: margin_band
  minimum_steer_gain_points: 1.0

  # --- track 3: project ---
  rank_grid: [4, 12, 28, 32, 64, 128]
  project_primary_rank: 28
  # Exploratory principal angles between the class-blind and correct-only bases
  # averaged 0.99, so this is a preregistered replication of an expected null.
  minimum_project_advantage_points: 1.0

  bootstrap_samples: 10000
  bootstrap_seed: 0
  alpha: 0.05

# Corrective replication of the only provisional track. Unlike the completed
# three-track experiment, all three partitions come from cached GSM8K test states,
# so the detector is not fitted on CODI's GSM8K-train population. This is a new
# contract and never overwrites the completed export.
endpoint_correctness_detect_replication:
  expected_examples: 1319
  fit_examples: 440
  select_examples: 440
  split_seed: 20260827
  fisher_shrinkage_grid: [0.01, 0.05, 0.2, 0.5, 0.9]
  probes:
    - margin
    - mean_difference
    - fisher
    - full_state
    - fisher_plus_margin
    - full_state_plus_margin
  ridge_grid: [0.0001, 0.001, 0.01, 0.1, 1.0]
  solver_max_iterations: 300
  solver_gradient_tolerance: 1.0e-7
  solver_objective_gap_tolerance: 1.0e-8
  baseline_probe: margin
  primary_probe: fisher_plus_margin
  minimum_delta_auc: 0.01
  bootstrap_samples: 10000
  bootstrap_seed: 20260827

# New experiment: separate state-12 covariance by observed correctness and solve
# C_correct v = lambda C_wrong v. The fixed 28-D top/bottom eigenspaces are tested
# against correct-only PCA, class-blind PCA, and class-energy-matched random bases.
# The 1,319 cached GSM8K-test examples are partitioned once; no final-test metric
# participates in fitting or shrinkage selection.
endpoint_correctness_contrastive_covariance:
  expected_examples: 1319
  fit_examples: 440
  select_examples: 440
  split_seed: 20260827
  rank: 28
  accuracy_band: [4, 32]
  shrinkage_grid: [0.01, 0.05, 0.2, 0.5, 0.9]
  random_replicates: 8
  random_seed: 20260827
  minimum_advantage_points: 1.0
  minimum_wrong_removal_gain_points: 1.0
  bootstrap_samples: 10000
  bootstrap_seed: 20260827
  alpha: 0.05

# Same-question correction follow-up. Output sampling alone cannot alter the
# pre-token state, so seeded relative-RMS perturbations enter at state 11 and the
# resulting correct/wrong state-12 pairs train an additive map inside PCs 4-31.
endpoint_paired_correction:
  expected_examples: 1319
  fit_examples: 440
  select_examples: 440
  split_seed: 20260827
  accuracy_band: [4, 32]
  relative_noise_schedule: [0.03, 0.05, 0.08, 0.12, 0.18, 0.27, 0.40, 0.60]
  noise_seed: 20260830
  minimum_paired_questions_per_split: 50
  ridge_grid: [0.01, 0.1, 1.0, 10.0, 100.0]
  shuffle_seed: 20260830
  alpha_grid: [0.0, 0.25, 0.5, 1.0, 1.5, 2.0]
  gate_fractions: [0.0, 0.10, 0.25, 0.50, 0.75, 1.0]
  minimum_gain_points: 1.0
  bootstrap_samples: 10000
  bootstrap_seed: 20260830
  alpha: 0.05

# Latent-trajectory detection gate. A cheap, read-only gate that must pass before
# any editing experiment at the latent thought states is proposed: it asks whether
# the 6x13 grid of latent-iteration hidden states predicts correctness beyond the
# endpoint margin (decisively: 0.02 AUC, since 0.013 was shown unresolvable on 439
# test questions) and whether it recovers the gold first answer token on questions
# the model gets wrong better than an endpoint-state probe and the majority class.
latent_trajectory_detect:
  expected_examples: 1319
  fit_examples: 440
  select_examples: 440
  split_seed: 20260827
  expected_partition_sha256: c8316e46dba419a22a9b2a2cdbdb644ee2d968d28e5de0a5e487b57b0b1868f2
  parity_relative_tolerance: 0.001
  correctness_ridge_grid: [0.0001, 0.01, 1.0]
  identity_ridge_grid: [0.001, 0.01, 0.1, 1.0]
  solver_max_iterations: 300
  solver_gradient_tolerance: 1.0e-7
  solver_objective_gap_tolerance: 1.0e-8
  minimum_delta_auc: 0.02
  minimum_identity_gain_points: 5.0
  bootstrap_samples: 10000
  bootstrap_seed: 20260901
  alpha: 0.05
