schema_version: 1

model:
  repo_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  revision: 73d63fa6f97d4285b49bdbedf6a161ceba1e55ad
  # BF16 is used only when the accelerator supports it. T4-class GPUs fall
  # back to float32 because this BF16-origin checkpoint produced non-finite
  # logits when it was forced into float16.
  precision: auto
  attention_implementation: eager
  max_new_tokens: 2048

prompt:
  instruction: >-
    Solve the following mathematics problem. Think step by step and put only
    the final answer inside \boxed{} at the end.

datasets:
  gsm8k:
    hf_id: openai/gsm8k
    revision: 740312a
    config: main
    split: test
    question_field: question
    answer_field: answer
    grader: gsm8k_numeric
    minimum_examples: 150
  math500:
    hf_id: HuggingFaceH4/MATH-500
    revision: 6e4ed1a
    split: test
    question_field: problem
    answer_field: answer
    level_field: level
    grader: math_verify
    minimum_examples: 150
  aime2024:
    hf_id: HuggingFaceH4/aime_2024
    revision: 58e32b4
    split: train
    question_field: problem
    answer_field: answer
    grader: math_verify
    minimum_examples: 150

screen:
  seed: 20260727
  examples_per_eligible_dataset: 64
  accuracy_min: 0.60
  accuracy_max: 0.85
  accuracy_midpoint: 0.725
  minimum_median_generated_tokens: 512

pilot:
  seed: 20260728
  examples: 150
  conditions:
    - full
    - full_repeat
    - retain_0.90
    - retain_0.50
    - retain_0.25
    - retain_0.10

compression:
  policy: heavy_hitter_recent
  recent_window: 32
  heavy_fraction: 0.50
  preserve_prompt: true
  # The requested fraction applies to generated reasoning tokens. The recent
  # window is a floor, so very short traces can temporarily retain more.

stochastic:
  enabled: true
  examples: 30
  retention: 0.50
  temperature: 0.60
  top_p: 0.95
  seeds: [101, 211, 307]

analysis:
  bootstrap_samples: 10000
  bootstrap_seed: 0
  early_entropy_tokens: 32
  cross_validation_folds: 5

gates:
  actionable_failure_rate_min: 0.05
  actionable_failure_rate_max: 0.25
  stochastic_noise_multiplier: 2.0
  minimum_adjacent_containment: 0.70
  maximum_difficulty_only_auc: 0.80
  maximum_induced_accuracy_loss: 0.01
  minimum_oracle_kv_saving: 0.20
