# Dataset sources + prompt format. Identifiers are configurable so they can be swapped
# for mirrors without touching code. Offline prepared copies are selected with
# CODIKAVA_DATA_ROOT (see scripts/dataset_prep.py).

train:
  # Two trace styles (proposal §5.2). Same schema: question / cot / answer.
  eq_only:
    hf_id: zen-E/GSM8k-Aug        # <<a op b=c>> equation-only CoT (386k)
    split: train
    data_file: gsm8k_aug_train.json
    revision: c4972fba71a612e2089d8fb10f78caa01c740083
  natural_language:
    hf_id: zen-E/GSM8k-Aug-NL     # natural-language CoT, same examples
    split: train
    data_file: gsm8k_aug_nl.json
    revision: e20551f801620cc7dd968edc941126e493fa8202
  fields:                         # column names in the source dataset
    question: question
    cot: cot
    answer: answer

eval:
  # Canonical OpenAI JSONL pinned to the archived source repository. Loading it through
  # the generic JSON builder avoids intermittent Xet/CDN signing failures on the HF mirror.
  gsm8k:
    hf_id: json
    split: test
    data_file: https://raw.githubusercontent.com/openai/grade-school-math/3101c7d5072418e28b9008a6636bde82a006892c/grade_school_math/data/test.jsonl
    kind: gsm8k_main
    source_repo: openai/grade-school-math
    source_revision: 3101c7d5072418e28b9008a6636bde82a006892c
  # These mirrors keep their source JSON files as ordinary Git blobs. Addressing those
  # pinned files directly prevents `datasets` from selecting auto-converted Xet Parquet.
  svamp:
    hf_id: json
    split: test
    data_file: https://huggingface.co/datasets/ChilleD/SVAMP/raw/5e0bf1e5e7c0e9c4bc39180d224f41f3f801b7ef/test.json
    kind: svamp
    source_repo: ChilleD/SVAMP
    source_revision: 5e0bf1e5e7c0e9c4bc39180d224f41f3f801b7ef
  multiarith:
    hf_id: json
    split: test
    data_file: https://huggingface.co/datasets/ChilleD/MultiArith/raw/144d44c3fb87c0b9097ac9593c789e716a282e3e/test.json
    kind: multiarith
    source_repo: ChilleD/MultiArith
    source_revision: 144d44c3fb87c0b9097ac9593c789e716a282e3e
  gsm_hard:
    hf_id: json
    split: train
    data_file: https://huggingface.co/datasets/reasoning-machines/gsm-hard/raw/960448f73503112d4226baeb8eb41d3fb5ae2506/gsmhardv2.jsonl
    kind: gsm_hard
    source_repo: reasoning-machines/gsm-hard
    source_revision: 960448f73503112d4226baeb8eb41d3fb5ae2506

# Prompt template. CODI uses an answer cue of "The answer is:"; the ":" token is the
# CODI distillation position (Phase 2), so keep the answer_prefix ending in ":".
prompt:
  question_prefix: "Question: "
  cot_prefix: ""
  answer_prefix: "The answer is:"
